<!DOCTYPE html>
<html lang="uk">
<head>

    <title>Мої захоплення</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>

</head>
<body>

<h1>Мої захоплення</h1>

<div class="container">
    <div class="card">Вільна боротьба 🤼</div>
    <div class="card">Ігри 🎮</div>
    <div class="card">Час вдома 🏠</div>
    <div class="card">Час з друзями 👥</div>
</div>

</body>
</html>
